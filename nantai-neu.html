
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NantAI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0a12;
      --panel: #171321;
      --violet: #8250df;
      --text: #f5f1ff;
      --muted: #b9aecb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding-left: 230px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid #30263e;
      background: var(--panel);
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--violet);
      border-radius: 14px;
      font-size: 24px;
    }

    h1 { margin: 0; font-size: 23px; }
    header p { margin: 3px 0 0; color: var(--muted); }

    #seitenleiste {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 220px;
      padding: 20px 12px;
      overflow-y: auto;
      background: #15121f;
      border-right: 1px solid #30283f;
      z-index: 1000;
    }

    #seitenleiste h2 {
      color: #a78bfa;
      font-size: 20px;
      margin: 0 0 8px;
    }

    #seitenleiste p {
      color: var(--muted);
      font-size: 14px;
    }

    #seitenleiste button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 9px;
      border: 1px solid #6d5a91;
      border-radius: 8px;
      background: #302442;
      color: white;
      font-size: 14px;
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    #seitenleiste button:hover { background: #493562; }

    #seitenleiste button.aktiv {
      background: #493562;
      border-color: #a78bfa;
    }

    main {
      width: min(900px, 100%);
      margin: auto;
      padding: 20px;
    }

    #status {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 14px;
    }

    #chat {
      min-height: 45vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--panel);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .user {
      background: #302044;
      align-self: flex-end;
      max-width: 90%;
    }

    .assistant { align-self: stretch; }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 18px 0;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      background: var(--violet);
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary { background: #292235; }
    button:disabled { opacity: .5; }

    .composer {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      padding: 12px 0 18px;
    }

    textarea, input {
      width: 100%;
      border: 1px solid #453653;
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      padding: 14px;
      font: inherit;
    }

    textarea { min-height: 90px; resize: vertical; }
    .row { display: flex; gap: 9px; margin-top: 9px; }
    .row button { flex: 1; }
    #bildVorschau { max-width: 100%; border-radius: 14px; margin-top: 12px; }
    .hidden { display: none; }

@media (max-width: 600px) {
  body {
    padding-left: 0;
    font-size: 16px;
  }

  header {
    padding: 12px;
    gap: 10px;
  }

  .logo {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  h1 {
    font-size: 21px;
  }

  #seitenleiste {
    position: sticky;
    top: 0;
    width: 100%;
    height: auto;
    max-height: 190px;
    padding: 12px;
    overflow-y: auto;
    border-right: none;
    border-bottom: 1px solid #30283f;
  }

  #seitenleiste h2 {
    font-size: 18px;
    margin-bottom: 4px;
  }

  #seitenleiste p {
    margin: 4px 0 8px;
  }

  #seitenleiste > button:first-of-type {
    width: 100%;
    text-align: center;
  }

  #chatliste {
    display: flex;
    flex-direction: row;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
  }

  #chatliste button {
    flex: 0 0 auto;
    width: auto;
    max-width: 200px;
    margin-bottom: 0;
    text-align: center;
  }

  main {
    width: 100%;
    padding: 12px;
  }

  #chat {
    min-height: 35vh;
    gap: 10px;
  }

  .message {
    padding: 12px;
    font-size: 16px;
  }

  .tools {
    gap: 8px;
  }

  .tools button,
  .row button {
    min-height: 46px;
  }

  .composer {
    position: sticky;
    bottom: 0;
    padding: 10px 0 max(12px, env(safe-area-inset-bottom));
  }

  textarea {
    min-height: 75px;
    font-size: 16px;
  }

  .row {
    gap: 8px;
  }
}
    
  </style>
</head>
<body>

  <aside id="seitenleiste">
    <h2>✦ NantAI</h2>
    <p>Deine Chats</p>
    <button type="button" onclick="neuerChat()">＋ Neuer Chat</button>
    <div id="chatliste"></div>
  </aside>

  <header>
    <div class="logo">✦</div>
    <div>
      <h1>NantAI</h1>
      <p>Dein persönlicher KI-Assistent</p>
    </div>
  </header>

  <main>
    <p id="status">NantAI ist bereit.</p>

    <section id="chat" aria-live="polite"></section>

    <div class="tools">
      <button class="secondary" onclick="spracheStarten()">🎙️ Sprache</button>
      <button class="secondary" onclick="spracheStoppen()">Stopp</button>
      <button class="secondary" onclick="bildModus()">🖼️ Bild erzeugen</button>
    </div>

    <section id="bildBereich" class="hidden">
      <input id="bildPrompt" placeholder="Beschreibe dein gewünschtes Bild">
      <div class="row">
        <button onclick="bildErzeugen()">Bild erstellen</button>
        <button class="secondary" onclick="bildModus()">Schließen</button>
      </div>
      <div id="bildErgebnis"></div>
    </section>

    <div class="composer">
      <textarea id="nachricht" placeholder="Schreibe eine Nachricht …"></textarea>
      <div class="row">
        <button onclick="nachrichtSenden()">Senden ➤</button>
        <button class="secondary" onclick="spracheStarten()">🎤 Jetzt sprechen</button>
      </div>
    </div>
  </main>

  <script>
    const BACKEND =
      'https://script.google.com/macros/s/AKfycbycGuJ6Dv6bjoRQ4gbjeHo7Kye8dG7suorRp__NZhCcnnEshFC3z7IGdIB5XKRHCI2p/exec';

    let nantaiChats = [];
    let nantaiAktiverChatId = null;
    let erkennung = null;

    function neueId() {
      return String(Date.now()) + '-' +
        Math.random().toString(36).slice(2, 8);
    }

    function begruessungsNachricht() {
      return [{
        text: 'Hallo! Ich bin NantAI. Wie kann ich dir heute helfen?',
        klasse: 'assistant'
      }];
    }

    function chatNachrichtenAktuell() {
      return Array.from(
        document.querySelectorAll('#chat .message')
      ).map(element => ({
        text: element.textContent,
        klasse: element.classList.contains('user') ? 'user' : 'assistant'
      }));
    }

    function chatVerlaufSpeichern() {
      const eintrag = nantaiChats.find(
        chat => chat.id === nantaiAktiverChatId
      );

      if (!eintrag) return;

      eintrag.nachrichten = chatNachrichtenAktuell();

      const ersteNachricht = eintrag.nachrichten.find(
        nachricht => nachricht.klasse === 'user'
      );

      if (ersteNachricht) {
        eintrag.titel = ersteNachricht.text.slice(0, 35);
      }

      try {
        localStorage.setItem('nantai_chats', JSON.stringify(nantaiChats));
        localStorage.setItem('nantai_aktiver_chat', nantaiAktiverChatId);
      } catch (fehler) {
        console.warn('Chats konnten nicht gespeichert werden.', fehler);
      }

      chatListeAktualisieren();
    }

    function chatNachrichtenAnzeigen(nachrichten) {
      const chat = document.getElementById('chat');
      chat.replaceChildren();

      nachrichten.forEach(nachricht => {
        const element = document.createElement('div');
        element.className = 'message ' +
          (nachricht.klasse === 'user' ? 'user' : 'assistant');
        element.textContent = nachricht.text;
        chat.appendChild(element);

        if (nachricht.klasse !== 'user' &&
            nachricht.text.startsWith('Hallo! Ich bin NantAI.')) {
          return;
        }
      });

      chat.scrollTop = chat.scrollHeight;
    }

    function nachrichtAnzeigen(text, klasse) {
      const element = document.createElement('div');
      element.className = 'message ' + klasse;
      element.textContent = text;

      document.getElementById('chat').appendChild(element);
      element.scrollIntoView({ behavior: 'smooth', block: 'end' });

      chatVerlaufSpeichern();
    }

    function chatListeAktualisieren() {
      const liste = document.getElementById('chatliste');
      if (!liste) return;

      liste.replaceChildren();

      nantaiChats.forEach(eintrag => {
        const knopf = document.createElement('button');
        knopf.type = 'button';
        knopf.textContent = eintrag.titel || 'Neuer Chat';

        if (eintrag.id === nantaiAktiverChatId) {
          knopf.classList.add('aktiv');
        }

        knopf.onclick = () => chatWechseln(eintrag.id);
        liste.appendChild(knopf);
      });
    }

    function chatWechseln(id) {
      chatVerlaufSpeichern();

      const eintrag = nantaiChats.find(chat => chat.id === id);
      if (!eintrag) return;

      nantaiAktiverChatId = id;
      chatNachrichtenAnzeigen(eintrag.nachrichten || []);
      chatListeAktualisieren();

      try {
        localStorage.setItem('nantai_aktiver_chat', id);
      } catch (fehler) {
        console.warn('Aktiver Chat konnte nicht gespeichert werden.', fehler);
      }
    }

    function chatVerlaufLaden() {
      try {
        const gespeichert = localStorage.getItem('nantai_chats');

        if (gespeichert) {
          const daten = JSON.parse(gespeichert);
          if (Array.isArray(daten)) nantaiChats = daten;
        }

        // Alte Einzel-Chat-Speicherung übernehmen.
        if (nantaiChats.length === 0) {
          const alt = localStorage.getItem('nantai_chatverlauf');
          let nachrichten = [];

          if (alt) {
            const datenAlt = JSON.parse(alt);
            if (Array.isArray(datenAlt)) nachrichten = datenAlt;
          }

          nantaiChats = [{
            id: neueId(),
            titel: 'Bisheriger Chat',
            nachrichten: nachrichten.length ? nachrichten : begruessungsNachricht()
          }];
        }

        nantaiAktiverChatId = localStorage.getItem('nantai_aktiver_chat');

        if (!nantaiChats.some(chat => chat.id === nantaiAktiverChatId)) {
          nantaiAktiverChatId = nantaiChats[0].id;
        }

        const aktiv = nantaiChats.find(
          chat => chat.id === nantaiAktiverChatId
        );

        chatNachrichtenAnzeigen(
          aktiv && Array.isArray(aktiv.nachrichten)
            ? aktiv.nachrichten
            : begruessungsNachricht()
        );

        chatListeAktualisieren();
        chatVerlaufSpeichern();
      } catch (fehler) {
        console.warn('Chatverlauf konnte nicht geladen werden.', fehler);

        if (nantaiChats.length === 0) {
          const chat = {
            id: neueId(),
            titel: 'Neuer Chat',
            nachrichten: begruessungsNachricht()
          };

          nantaiChats.push(chat);
          nantaiAktiverChatId = chat.id;
          chatNachrichtenAnzeigen(chat.nachrichten);
          chatListeAktualisieren();
        }
      }
    }

    function neuerChat() {
      chatVerlaufSpeichern();

      const eintrag = {
        id: neueId(),
        titel: 'Neuer Chat',
        nachrichten: begruessungsNachricht()
      };

      nantaiChats.unshift(eintrag);
      nantaiAktiverChatId = eintrag.id;

      chatNachrichtenAnzeigen(eintrag.nachrichten);
      chatVerlaufSpeichern();
    }

    function jsonpAnfrage(parameter) {
      return new Promise((resolve, reject) => {
        const callbackName = 'nantaiCallback_' +
          Date.now() + '_' + Math.random().toString(36).slice(2);

        const script = document.createElement('script');
        const url = new URL(BACKEND);

        Object.entries(parameter).forEach(([schluessel, wert]) => {
          url.searchParams.set(schluessel, wert);
        });

        url.searchParams.set('callback', callbackName);

        const timeout = setTimeout(() => {
          aufraeumen();
          reject(new Error('Zeitüberschreitung bei der Verbindung.'));
        }, 60000);

        function aufraeumen() {
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = daten => {
          aufraeumen();
          resolve(daten);
        };

        script.onerror = () => {
          aufraeumen();
          reject(new Error('Backend konnte nicht erreicht werden.'));
        };

        script.src = url.toString();
        document.head.appendChild(script);
      });
    }

    async function nachrichtSenden() {
      const feld = document.getElementById('nachricht');
      const text = feld.value.trim();
      if (!text) return;

      feld.value = '';
      nachrichtAnzeigen(text, 'user');
      document.getElementById('status').textContent = 'NantAI denkt …';

      try {
        const daten = await jsonpAnfrage({
          aktion: 'chat',
          nachricht: text
        });

        if (!daten.erfolg) {
          throw new Error(daten.fehler || 'Unbekannter Fehler');
        }

        nachrichtAnzeigen(daten.antwort, 'assistant');

        const vorleseKnopf = nantaiVorleseKnopf(daten.antwort);
        document.getElementById('chat').appendChild(vorleseKnopf);

        document.getElementById('status').textContent = 'Antwort erhalten.';
      } catch (fehler) {
        nachrichtAnzeigen('Fehler: ' + fehler.message, 'assistant');
        document.getElementById('status').textContent =
          'Verbindung fehlgeschlagen.';
      }
    }

    function bildModus() {
      document.getElementById('bildBereich').classList.toggle('hidden');
    }

    async function bildErzeugen() {
      const prompt = document.getElementById('bildPrompt').value.trim();

      if (!prompt) {
        document.getElementById('status').textContent =
          'Bitte beschreibe das Bild.';
        return;
      }

      document.getElementById('status').textContent = 'Bild wird erstellt …';
      document.getElementById('bildErgebnis').replaceChildren();

      try {
        const daten = await jsonpAnfrage({
          aktion: 'bild',
          prompt: prompt
        });

        if (!daten.erfolg) {
          throw new Error(daten.fehler || 'Bild konnte nicht erstellt werden.');
        }

        const bild = document.createElement('img');
        bild.id = 'bildVorschau';
        bild.alt = prompt;
        bild.src = daten.bild;
        document.getElementById('bildErgebnis').appendChild(bild);

        document.getElementById('status').textContent = 'Bild erstellt.';
      } catch (fehler) {
        document.getElementById('status').textContent =
          'Bildfehler: ' + fehler.message;
      }
    }

    function spracheStarten() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        document.getElementById('status').textContent =
          'Spracherkennung wird in diesem Browser nicht unterstützt.';
        return;
      }

      if (erkennung) erkennung.stop();

      erkennung = new SpeechRecognition();
      erkennung.lang = 'de-DE';
      erkennung.continuous = false;
      erkennung.interimResults = false;

      erkennung.onstart = () => {
        document.getElementById('status').textContent = 'Ich höre zu …';
      };

      erkennung.onresult = event => {
        const erkannt = event.results[0][0].transcript;
        const feld = document.getElementById('nachricht');
        feld.value = (feld.value ? feld.value + ' ' : '') + erkannt;
        feld.focus();
        document.getElementById('status').textContent = 'Sprache erkannt.';
      };

      erkennung.onerror = event => {
        document.getElementById('status').textContent =
          'Sprachfehler: ' + event.error;
      };

      erkennung.onend = () => {
        if (document.getElementById('status').textContent === 'Ich höre zu …') {
          document.getElementById('status').textContent =
            'Spracherkennung beendet.';
        }
      };

      erkennung.start();
    }

    function spracheStoppen() {
      if (erkennung) erkennung.stop();
      document.getElementById('status').textContent =
        'Spracherkennung gestoppt.';
    }

    function nantaiVorlesen(text) {
      if (!('speechSynthesis' in window)) {
        alert('Vorlesen wird von diesem Browser nicht unterstützt.');
        return;
      }

      window.speechSynthesis.cancel();

      const stimme = new SpeechSynthesisUtterance(text);
      stimme.lang = 'de-DE';
      stimme.rate = 1;
      stimme.pitch = 1;

      window.speechSynthesis.speak(stimme);
    }

    function nantaiVorleseKnopf(text) {
      const knopf = document.createElement('button');
      knopf.type = 'button';
      knopf.className = 'secondary';
      knopf.textContent = '🔊 Vorlesen';
      knopf.onclick = () => nantaiVorlesen(text);
      return knopf;
    }

    document.getElementById('nachricht').addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        nachrichtSenden();
      }
    });

    chatVerlaufLaden();
  </script>
</body>
</html>
